# spec 008 RF-17 — cabeceras de las respuestas ESTÁTICAS del frontend.
# `always`: también en 404 y otras respuestas de error.
# Se incluye en cada `location` estático (no a nivel `server`): en nginx un `add_header` dentro de un `location` descarta
# los heredados, y en `/api/` duplicaría las cabeceras que ya manda el backend.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# El token de un enlace de gestión viaja en la URL: nunca debe salir como Referer hacia otros sitios.
add_header Referrer-Policy "no-referrer" always;
